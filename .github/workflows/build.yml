name: build

# push / PR / 手动触发时编译验证；打 tag（v*）时额外发布 GitHub Release，不做定时任务。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Build all platforms
        run: make all

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: socks5scan-binaries
          path: bin/socks5scan-*

  release:
    # 只有打 tag 的 push 才发布 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: make all

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/socks5scan-*
          generate_release_notes: true
